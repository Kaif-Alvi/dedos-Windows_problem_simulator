<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Application Chrash</title>
    <style>
        body {
            margin: 0;
            background: #f3f3f3;
            height: 100vh;
            display: grid;
            place-items: center;
            font: 14px 'Segoe UI';
            color: #222
        }

        .dialog {
            width: 430px;
            background: white;
            border: 1px solid #aaa;
            box-shadow: 0 8px 30px #999;
            padding: 24px
        }

        .title {
            font-size: 18px;
            margin-bottom: 18px
        }

        .icon {
            color: #c42;
            font-size: 32px;
            float: left;
            margin-right: 14px
        }.buttons {
            text-align: right;
            margin-top: 24px
        }

        .buttons span {
            border: 1px solid #888;
            padding: 7px 20px;
            margin-left: 8px
        }

        .warn {
            position: fixed;
            bottom: 15px;
            color: #777;
            font-size: 12px
        }
    </style>
</head>
<body>
    <div class="dialog">
        <div class="title"><span class="icon">!</span>ExampleApp.exe has stopped working</div>
        <p>A problem caused the program to stop working correctly. Windows will close the program and notify you if a
            solution is available.</p>
        <div class="buttons"><span>Close the program</span><span>Debug</span></div>
    </div>
    <div class="warn">Simulation only. Press Ctrl + Alt + Win + C to exit.</div>
    <script>window.dedosPause = () => { }; window.dedosResume = () => { };</script>
</body>

</html>
