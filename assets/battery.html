<!doctype html>
<html>

<head>
    <meta charset="UTF-8">
    <title>Battery Critical</title>
    <style>
        body {
            margin: 0;
            background: #151515;
            color: #eee;
            height: 100vh;
            display: grid;
            place-items: center;
            font: 17px 'Segoe UI'
        }

        .box {
            text-align: center
        }

        .battery {
            width: 260px;
            height: 100px;
            border: 5px solid #aaa;
            position: relative;
            margin: auto
        }

        .battery:after {
            content: '';
            position: absolute;
            right: -22px;
            top: 32px;
            width: 16px;
            height: 36px;
            background: #aaa
        }

        .fill {
            height: 100%;
            width: 8%;
            background: #e33
        }

        .warn {
            position: fixed;
            bottom: 16px;
            color: #888;
            font-size: 12px
        }
    </style>
</head>

<body>
    <div class="box">
        <div class="battery">
            <div class="fill"></div>
        </div>
        <h2>Battery critically low</h2>
        <p>Plug in your PC now to avoid losing your work.</p>
    </div>
    <div class="warn">Simulation only. Press Ctrl + Alt + Win + C to exit.</div>
    <script>window.dedosPause = () => { }; window.dedosResume = () => { };</script>
</body>

</html>
