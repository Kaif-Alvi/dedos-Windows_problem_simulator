<!doctype html>
<html>

<head>
    <meta charset="UTF-8">
    <title>Windows Boot Loop</title>
    <style>
        body {
            margin: 0;
            background: #07111c;
            color: #dbeafe;
            font: 18px 'Segoe UI', sans-serif;
            height: 100vh;
            display: grid;
            place-items: center
        }

        .box {
            width: 520px;
            text-align: center
        }

        .ring {
            margin: auto auto 24px;
            width: 64px;
            height: 64px;
            border: 5px solid #28445e;
            border-top-color: #4cc9f0;
            border-radius: 50%;
            animation: r 1s linear infinite
        }

        @keyframes r {
            to {
                transform: rotate(360deg)
            }
        }

        p {
            color: #8aa4bd
        }

        .warn {
            position: fixed;
            bottom: 18px;
            font-size: 12px;
            color: #587086
        }
    </style>
</head>

<body>
    <div class="box">
        <div class="ring"></div>
        <h1>Preparing Automatic Repair</h1>
        <p>Your PC did not start correctly. Restarting...</p>
        <p id="count">Restart attempt 1</p>
    </div>
    <div class="warn">Simulation only. Press Ctrl + Alt + Win + C to exit.</div>
    <script>let n = 1, r = true; function tick() { if (r) { n = n % 5 + 1; count.innerText = 'Restart attempt ' + n } setTimeout(tick, 1200) } tick(); window.dedosPause = () => r = false; window.dedosResume = () => r = true;</script>
</body>

</html>
