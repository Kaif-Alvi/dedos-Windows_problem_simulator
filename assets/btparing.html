<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Bluetooth Paring Error</title>
    <style>
        body {
            background: #1e1e1e;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', sans-serif;
            color: #fff;
            overflow: hidden;
        }

        .dialog {
            width: 440px;
            background: #2d2d2d;
            border: 1px solid #3f3f3f;
            border-radius: 8px;
            padding: 24px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
        }

        .title {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 12px;
            color: #ff5555;
        }

        .desc {
            font-size: 13.5px;
            color: #ccc;
            line-height: 1.6;
            margin-bottom: 20px;
        }

        .device-box {
            background: #252525;
            border: 1px solid #444;
            border-radius: 6px;
            padding: 12px;
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 20px;
        }

        .bt-icon {
            font-size: 28px;
            color: #61afef;
        }

        .device-name {
            font-size: 14px;
            font-weight: 600;
        }

        .device-status {
            font-size: 12px;
            color: #e06c75;
        }

        .btn-row {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
        }

        .btn {
            padding: 8px 18px;
            font-size: 13px;
            background: #0078d7;
            color: #fff;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        .btn:hover {
            background: #1084e3;
        }

        .warn {
            position: fixed;
            bottom: 18px;
            font-size: 12px;
            color: #777;
        }
    </style>
</head>

<body>
    <div class="dialog">
        <div class="title">⚠️ Couldn't connect</div>
        <div class="desc">Make sure your device is still discoverable and try connecting again. Windows failed to
            complete the handshake protocol.</div>

        <div class="device-box">
            <div class="bt-icon">ᛒ</div>
            <div>
                <div class="device-name">Wireless Headphones X-Pro</div>
                <div class="device-status">Connection failed (Error code: 0x80070015)</div>
            </div>
        </div>

        <div class="btn-row">
            <button class="btn" onclick="location.reload()">Try Again</button>
        </div>
    </div>

    <div class="warn">Simulation only. Press Ctrl + Alt + Win + C to exit.</div>

    <script>
        window.dedosPause = function () { };
        window.dedosResume = function () { };
    </script>
</body>

</html>
