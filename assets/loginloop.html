<!doctype html>
<html>

<head>
    <meta charset="UTF-8">
    <title>Sign-in Loop</title>
    <style>
        body {
            margin: 0;
            background: #1d3048;
            color: #fff;
            height: 100vh;
            display: grid;
            place-items: center;
            font: 16px 'Segoe UI'
        }

        .box {
            text-align: center
        }

        .avatar {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: #91a8bd;
            margin: auto auto 20px
        }

        .spin {
            margin: 24px auto;
            border: 3px solid #7890a5;
            border-top-color: #fff;
            border-radius: 50%;
            width: 28px;
            height: 28px;
            animation: r 1s linear infinite
        }

        @keyframes r {
            to {
                transform: rotate(360deg)
            }
        }

        .warn {
            position: fixed;
            bottom: 16px;
            font-size: 12px;
            color: #a9bfd2
        }
    </style>
</head>

<body>
    <div class="box">
        <div class="avatar"></div>
        <div>Welcome</div>
        <div class="spin"></div>
        <div id="text">Signing in...</div>
    </div>
    <div class="warn">Simulation only. Press Ctrl + Alt + Win + C to exit.</div>
    <script>let r = true;
        window.dedosPause = () => r = false;
        window.dedosResume = () => r = true;
    </script>
</body>

</html>
