<!doctype html>
<html>

<head>
    <meta charset="UTF-8">
    <title>Memory Diagnostic</title>
    <style>
        body {
            margin: 0;
            background: #071a12;
            color: #d7ffe7;
            height: 100vh;
            display: grid;
            place-items: center;
            font: 18px Consolas, monospace
        }

        .box {
            width: 620px
        }

        .bar {
            height: 18px;
            background: #173d2b;
            border: 1px solid #4bd58a
        }

        .fill {
            height: 100%;
            background: #4bd58a;
            width: 0%;
            transition: width .2s
        }

        .small {
            font-size: 13px;
            color: #8ac9a5;
            margin-top: 20px
        }

        .warn {
            position: fixed;
            bottom: 16px;
            font: 12px 'Segoe UI';
            color: #628b75
        }
    </style>
</head>

<body>
    <div class="box">
        <h2>Windows Memory Diagnostic</h2>
        <p>Testing memory... <b id="pct">0%</b></p>
        <div class="bar">
            <div class="fill" id="fill"></div>
        </div>
        <p class="small" id="status">Writing test pattern</p>
    </div>
    <div class="warn">Simulation only. Press Ctrl + Alt + Win + C to exit.</div>
    <script>let p = 0, r = true; function tick() { if (r) { p = p < 100 ? p + 2 : 0; fill.style.width = p + '%'; pct.innerText = p + '%'; status.innerText = p > 70 ? 'Reading memory addresses' : 'Writing test pattern' } setTimeout(tick, 100) } tick(); window.dedosPause = () => r = false; window.dedosResume = () => r = true;</script>
</body>

</html>
