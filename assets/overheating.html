<!doctype html>
<html>

<head>
    <meta charset="UTF-8">
    <title>Thermal Warning</title>
    <style>
        body {
            margin: 0;
            background: #180b08;
            color: #fff;
            height: 100vh;
            display: grid;
            place-items: center;
            font: 18px 'Segoe UI'
        }

        .box {
            width: 460px;
            text-align: center;
            border: 2px solid #ef6c35;
            padding: 32px;
            background: #28100b
        }

        .temp {
            font-size: 64px;
            color: #ff824d
        }

        .bar {
            height: 16px;
            background: #4d2115
        }

        .fill {
            height: 100%;
            background: #ff5722;
            width: 60%
        }

        .warn {
            position: fixed;
            bottom: 16px;
            font-size: 12px;
            color: #ad7562
        }
    </style>
</head>

<body>
    <div class="box">
        <div class="temp" id="temp">82°C</div>
        <h2>High temperature detected</h2>
        <p>Performance has been reduced to protect your processor.</p>
        <div class="bar">
            <div class="fill" id="fill"></div>
        </div>
    </div>
    <div class="warn">Simulation only. Press Ctrl + Alt + Win + C to exit.</div>
    <script>let t = 82, r = true; function tick() { if (r) { t = t > 98 ? 75 : t + 1; temp.innerText = t + '°C'; fill.style.width = t + '%' } setTimeout(tick, 500) } tick(); window.dedosPause = () => r = false; window.dedosResume = () => r = true;</script>
</body>

</html>
