<!doctype html>
<html>

<head>
    <meta charset="UTF-8">
    <title>Access Denied</title>
    <style>
        body {
            margin: 0;
            background: #f4f4f4;
            color: #222;
            height: 100vh;
            display: grid;
            place-items: center;
            font: 15px 'Segoe UI'
        }

        .box {
            background: #fff;
            border: 1px solid #aaa;
            padding: 28px;
            width: 450px
        }

        .icon {
            color: #c33;
            font-size: 44px;
            float: left;
            margin-right: 16px
        }

        .warn {
            position: fixed;
            bottom: 16px;
            color: #777;
            font-size: 12px
        }
    </style>
</head>

<body>
    <div class="box">
        <div class="icon">⊘</div>
        <h2>Access is denied</h2>
        <p>You do not have permission to access this folder.</p>
        <p>Contact your administrator for access.</p>
    </div>
    <div class="warn">Simulation only. Press Ctrl + Alt + Win + C to exit.</div>
    <script>window.dedosPause = () => { }; window.dedosResume = () => { };</script>
</body>

</html>
