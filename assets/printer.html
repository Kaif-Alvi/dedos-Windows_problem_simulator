<!doctype html>
<html>

<head>
    <meta charset="UTF-8">
    <title>Printer Offline</title>
    <style>
        body {
            margin: 0;
            background: #f5f6f7;
            color: #222;
            height: 100vh;
            display: grid;
            place-items: center;
            font: 16px 'Segoe UI'
        }

        .box {
            background: #fff;
            border: 1px solid #bbb;
            padding: 28px;
            width: 430px;
            text-align: center
        }

        .printer {
            font-size: 60px;
            color: #526575
        }

        .red {
            color: #c62828
        }

        .warn {
            position: fixed;
            bottom: 16px;
            color: #777;
            font-size: 12px
        }
    </style>
</head>

<body>
    <div class="box">
        <div class="printer">▣</div>
        <h2>Printer is offline</h2>
        <p class="red">Unable to communicate with HP OfficeJet</p>
        <p>Check the printer connection and try again.</p>
    </div>
    <div class="warn">Simulation only. Press Ctrl + Alt + Win + C to exit.</div>
    <script>window.dedosPause = () => { }; window.dedosResume = () => { };</script>
</body>

</html>
