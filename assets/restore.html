<!doctype html>
<html>

<head>
    <meta charset="UTF-8">
    <title>System Restore</title>
    <style>
        body {
            margin: 0;
            background: #101d2e;
            color: #e5f0ff;
            height: 100vh;
            display: grid;
            place-items: center;
            font: 17px 'Segoe UI'
        }

        .box {
            width: 520px
        }

        .bar {
            height: 16px;
            background: #29405c
        }

        .fill {
            height: 100%;
            background: #63b3ed;
            width: 0%;
            transition: width .4s
        }

        .warn {
            position: fixed;
            bottom: 16px;
            color: #7890a8;
            font-size: 12px
        }
    </style>
</head>

<body>
    <div class="box">
        <h2>Restoring system files and settings</h2>
        <p id="pct">Starting System Restore...</p>
        <div class="bar">
            <div class="fill" id="fill"></div>
        </div>
        <p>Please wait while your system is restored.</p>
    </div>
    <div class="warn">Simulation only. Press Ctrl + Alt + Win + C to exit.</div>
    <script>let p = 0, r = true; function t() { if (r) { p = p >= 100 ? 0 : p + 1; fill.style.width = p + '%'; pct.innerText = p + '% complete' } setTimeout(t, 100) } t(); window.dedosPause = () => r = false; window.dedosResume = () => r = true;</script>
</body>

</html>
