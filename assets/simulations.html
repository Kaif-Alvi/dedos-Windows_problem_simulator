<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Simulations</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    background: radial-gradient(circle at top, #1b1f2a 0%, #0d0f14 100%);
    height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    font-family:'Segoe UI', sans-serif;
    color:#eaeaea;
    overflow:hidden;
  }

  .step { display:none; flex-direction:column; align-items:center; width:100%; }
  .step.active { display:flex; }

  h1 {
    font-size:22px;
    margin-bottom:8px;
    background:linear-gradient(90deg,#5ad1ff,#8a7bff);
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
  }
  .subtitle { color:#8892a6; font-size:12.5px; margin-bottom:30px; }

  /* ==== STEP 1: CATEGORY CARDS ==== */
  .cat-grid {
    display:flex;
    gap:18px;
  }
  .cat-card {
    width:170px;
    padding:28px 16px;
    background:#151923;
    border:1px solid #2a3040;
    border-radius:14px;
    text-align:center;
    cursor:pointer;
    transition:all .15s ease;
  }
  .cat-card:hover { border-color:#5ad1ff; transform:translateY(-4px); background:#1a1f2c; }
  .cat-icon { font-size:34px; margin-bottom:10px; }
  .cat-name { font-size:14px; font-weight:600; margin-bottom:4px; }
  .cat-desc { font-size:11px; color:#8892a6; }

  /* ==== STEP 2: ITEM LIST ==== */
  .item-list {
    display:flex;
    flex-direction:column;
    gap:10px;
    width:420px;
    max-height:340px;
    overflow-y:auto;
  }
  .item-row {
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:14px 18px;
    background:#151923;
    border:1px solid #2a3040;
    border-radius:10px;
    cursor:pointer;
    transition:all .15s ease;
  }
  .item-row:hover { border-color:#5ad1ff; background:#1a1f2c; }
  .item-title { font-size:13.5px; font-weight:600; }
  .item-arrow { color:#5ad1ff; font-size:14px; }

  /* ==== STEP 3: DETAIL PAGE ==== */
  .detail-box {
    width:440px;
    background:#151923;
    border:1px solid #2a3040;
    border-radius:16px;
    padding:30px;
    text-align:center;
  }
  .detail-icon { font-size:44px; margin-bottom:14px; }
  .detail-title { font-size:19px; font-weight:700; margin-bottom:10px; }
  .detail-desc { font-size:13px; color:#c3c9d6; line-height:1.7; margin-bottom:24px; }
  .go-btn {
    width:100%;
    padding:16px 0;
    font-size:17px;
    font-weight:700;
    letter-spacing:2px;
    color:#0d0f14;
    background:linear-gradient(90deg,#5ad1ff,#8a7bff);
    border:none;
    border-radius:12px;
    cursor:pointer;
  }
  .go-btn:hover { opacity:.92; }

  /* ==== COMMON BACK LINK ==== */
  .back-link {
    margin-top:22px;
    color:#6b7386;
    font-size:12px;
    cursor:pointer;
    text-decoration:underline;
  }
  .hint {
    position:fixed;
    bottom:16px;
    font-size:11px;
    color:#4a5062;
  }
</style>
</head>
<body>

  <!-- ============ STEP 1: CATEGORY SELECT ============ -->
  <div class="step active" id="step1">
    <h1>Select a category</h1>
    <div class="subtitle">What type of problem would you like to see?</div>
    <div class="cat-grid" id="catGrid"></div>
    <div class="back-link" onclick="goLoadPage('home')">← Return to home</div>
  </div>

  <!-- ============ STEP 2: ITEM LIST ============ -->
  <div class="step" id="step2">
    <h1 id="step2Title">Select a simulation</h1>
    <div class="subtitle">Click a problem to start the simulation</div>
    <div class="item-list" id="itemList"></div>
    <div class="back-link" onclick="showStep(1)">← Return to categories</div>
  </div>

  <!-- ============ STEP 3: DETAIL + START ============ -->
  <div class="step" id="step3">
    <div class="detail-box">
      <div class="detail-icon" id="detailIcon">🟦</div>
      <div class="detail-title" id="detailTitle">BSOD</div>
      <div class="detail-desc" id="detailDesc">...</div>
      <button class="go-btn" id="startBtn">START</button>
    </div>
    <div class="back-link" id="backToListLink">← Return to list</div>
  </div>

  <div class="hint">Exit: Ctrl+Alt+Win+C &nbsp;•&nbsp; Pause: Ctrl+Alt+Win+P &nbsp;•&nbsp; Resume: Ctrl+Alt+Win+R</div>

  let currentCategory = null;
  let currentItem = null;

  // ================= STEP NAVIGATION =================
  function showStep(n) {
    document.querySelectorAll('.step').forEach(el => el.classList.remove('active'));
    document.getElementById('step' + n).classList.add('active');
  }

  // ================= STEP 1: RENDER CATEGORY CARDS =================
  function renderCategories() {
    const grid = document.getElementById('catGrid');
    grid.innerHTML = '';
    CATEGORIES.forEach(cat => {
      const div = document.createElement('div');
      div.className = 'cat-card';
      div.innerHTML = '<div class="cat-icon">' + cat.icon + '</div>' +
        '<div class="cat-name">' + cat.name + '</div>' +
        '<div class="cat-desc">' + cat.desc + '</div>';
      div.onclick = () => openCategory(cat.id);
      grid.appendChild(div);
    });
  }

  function openCategory(catId) {
    currentCategory = CATEGORIES.find(c => c.id === catId);
    document.getElementById('step2Title').innerText = currentCategory.name;
    const list = document.getElementById('itemList');
    list.innerHTML = '';
    currentCategory.items.forEach(item => {
      const row = document.createElement('div');
      row.className = 'item-row';
      row.setAttribute('role', 'button');
      row.setAttribute('tabindex', '0');
      row.innerHTML = '<div class="item-title">' + item.icon + ' &nbsp;' + item.title + '</div>' +
        '<div class="item-arrow">→</div>';
      row.onclick = () => launchSimulation(item);
      row.onkeydown = event => {
        if (event.key === 'Enter' || event.key === ' ') {
          event.preventDefault();
          launchSimulation(item);
        }
      };
      list.appendChild(row);
    });
    showStep(2);
  }

  // ================= STEP 3: DETAIL PAGE =================
  function openDetail(item) {
    currentItem = item;
    document.getElementById('detailIcon').innerText = item.icon;
    document.getElementById('detailTitle').innerText = item.title;
    document.getElementById('detailDesc').innerText = item.desc;
    document.getElementById('backToListLink').onclick = () => showStep(2);
    showStep(3);
  }

  function launchSimulation(item) {
    currentItem = item;
    const trigger = window[item.trigger];
    if (typeof trigger !== 'function') {
      document.getElementById('step2Title').innerText = 'Simulation unavailable';
      document.querySelector('#step2 .subtitle').innerText = 'The Go trigger is not connected: ' + item.id;
      showStep(2);
      return;
    }
    if (item.trigger === 'goTriggerProblem') {
      trigger(item.id);
    } else {
      trigger();
    }
  }

  // Clicking START calls the corresponding Go trigger function
  document.getElementById('startBtn').addEventListener('click', () => {
    if (currentItem) launchSimulation(currentItem);
  });

  renderCategories();
</script>
</body>
</html>
