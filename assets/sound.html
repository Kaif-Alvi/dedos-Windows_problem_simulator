<!doctype html>
<html>

<head>
    <meta charset="UTF-8">
    <title>Audio Service</title>
    <style>
        body {
            margin: 0;
            background: #20162b;
            color: #f5eaff;
            height: 100vh;
            display: grid;
            place-items: center;
            font: 17px 'Segoe UI'
        }

        .box {
            text-align: center
        }

        .speaker {
            font-size: 70px
        }

        .bars {
            display: flex;
            gap: 8px;
            align-items: end;
            justify-content: center;
            height: 90px
        }

        .bar {
            width: 12px;
            background: #db8cff;
            animation: b .7s infinite alternate
        }

        @keyframes b {
            to {
                height: 80px
            }
        }

        .warn {
            position: fixed;
            bottom: 16px;
            color: #a791ae;
            font-size: 12px
        }
    </style>
</head>

<body>
    <div class="box">
        <div class="speaker">♫</div>
        <h2>No audio output device installed</h2>
        <div class="bars"><i class="bar" style="height:30px"></i><i class="bar" style="height:60px"></i><i class="bar"
                style="height:42px"></i><i class="bar" style="height:70px"></i></div>
        <p>Windows cannot find your speaker or headphones.</p>
    </div>
    <div class="warn">Simulation only. Press Ctrl + Alt + Win + C to exit.</div>
    <script>window.dedosPause = () => { }; window.dedosResume = () => { };</script>
</body>

</html>
