<!doctype html>
<html>

<head>
    <meta charset="UTF-8">
    <title>Storage Warning</title>
    <style>
        body {
            margin: 0;
            background: #20150b;
            color: #fff3df;
            height: 100vh;
            display: grid;
            place-items: center;
            font: 17px 'Segoe UI'
        }

        .box {
            width: 480px;
            border: 1px solid #b87531;
            background: #35200d;
            padding: 28px
        }

        .warn {
            color: #ffb45e;
            font-size: 34px;
            float: left;
            margin-right: 14px
        }

        .bar {
            height: 18px;
            background: #6b401c
        }

        .fill {
            height: 100%;
            background: #ff8a24;
            width: 92%
        }

        .footer {
            position: fixed;
            bottom: 16px;
            color: #ad8763;
            font-size: 12px
        }
    </style>
</head>

<body>
    <div class="box">
        <div class="warn">!</div>
        <h2>Storage space is critically low</h2>
        <p>Some features may stop working until you free space.</p>
        <div class="bar">
            <div class="fill"></div>
        </div>
        <p>235 GB used of 256 GB</p>
    </div>
    <div class="footer">Simulation only. Press Ctrl + Alt + Win + C to exit.</div>
    <script>window.dedosPause = () => { }; window.dedosResume = () => { };</script>
</body>

</html>
